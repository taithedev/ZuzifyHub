name: Bootstrap source and publish Zuzify Hub for Windows

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore full React and Tauri project and Windows icon
        shell: pwsh
        run: |
          @'
          import base64
          import io
          import struct
          import tarfile
          from pathlib import Path

          payload = base64.b64decode(Path(".bootstrap/source.tar.xz.b64").read_text(encoding="ascii"))
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as archive:
              root = Path.cwd().resolve()
              for member in archive.getmembers():
                  member_path = (root / member.name).resolve()
                  if member_path != root and root not in member_path.parents:
                      raise RuntimeError("Unsafe archive path: " + member.name)
                  if not member.isfile() and not member.isdir():
                      raise RuntimeError("Unexpected archive member: " + member.name)
              archive.extractall(root, filter="data")

          icon = Path("src-tauri/icons/icon.png").read_bytes()
          ico = struct.pack("<HHH", 0, 1, 1)
          ico += struct.pack("<BBBBHHII", 0, 0, 0, 0, 1, 32, len(icon), 22)
          ico += icon
          Path("src-tauri/icons/icon.ico").write_bytes(ico)

          # Bootstrap payload is temporary; the final repository contains readable source.
          Path(".bootstrap/source.tar.xz.b64").unlink()
          Path(".github/workflows/bootstrap.yml").unlink()
          Path(".bootstrap").rmdir()
          print("Restored the complete React/Tauri application source.")
          '@ | python -

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and create lockfile
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify React TypeScript and Vite build
        shell: pwsh
        run: npm run build

      - name: Commit restored project to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upload Zuzify Hub React/Tauri source and lockfile"
          if ($LASTEXITCODE -ne 0) { throw "Source commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Source upload to main failed" }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build native Windows installer
        shell: pwsh
        run: npm run desktop:build

      - name: Prepare checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($files.Count -eq 0) { throw 'No Windows NSIS installer was produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Store Windows installer as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuzifyHub-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Tag release and publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag v0.1.0
          git push origin v0.1.0
          if ($LASTEXITCODE -ne 0) { throw "Git tag push failed" }
          $assets = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path 'SHA256SUMS.txt').Path
          gh release create v0.1.0 @assets --verify-tag --title 'Zuzify Hub v0.1.0' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed" }
