name: Build and release Zuzify Hub Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
    paths:
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React and Windows NSIS installer
        run: npm run desktop:build

      - name: SHA256 checksums
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($assets.Count -eq 0) { throw 'No Windows installer found' }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZuzifyHub-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish v0.1.0 or tagged version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { $env:GITHUB_REF_NAME } else { 'v0.1.0' }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            git tag $tag
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw 'Unable to push release tag' }
          }
          $assets = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path 'SHA256SUMS.txt').Path
          gh release create $tag @assets --verify-tag --title "Zuzify Hub $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed' }
